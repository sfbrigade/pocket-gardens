services:
  db:
    image: postgres:18.3
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - 5432:5432
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - pocket-gardens
  mail:
    image: dockage/mailcatcher:0.9.0
    ports:
      - 1025:1025
      - 1080:1080
    networks:
      - pocket-gardens
  storage-init:
    image: rustfs/rc:latest
    user: root
    entrypoint: chown
    command: -R 10001:10001 /data
    volumes:
      - ./data/rustfs:/data
  storage:
    image: rustfs/rustfs:1.0.0
    environment:
      - RUSTFS_ACCESS_KEY=storageadmin
      - RUSTFS_SECRET_KEY=storageadmin
      - RUSTFS_CORS_ALLOWED_ORIGINS=*
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - ./data/rustfs:/data
    networks:
      - pocket-gardens
    depends_on:
      - storage-init
  storage-setup:
    image: rustfs/rc:latest
    entrypoint: |
      /bin/sh -c "
      sleep 1;
      rc alias set storage http://storage:9000 storageadmin storageadmin;
      rc mb --ignore-existing storage/app;
      exit 0;
      "
    networks:
      - pocket-gardens
    depends_on:
      - storage
networks:
  pocket-gardens:
    name: pocket-gardens
    driver: bridge
